<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' https: data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'"

    <link rel="manifest" href="./manifest.webmanifest" />

    <link rel="stylesheet" href="./style.css" />
    <title>就活OS</title>
  </head>
  <body>
    <!-- アプリヘッダー -->
    <header class="topbar">
      <a href="#" class="brand">就活<span>OS</span></a>

    <!-- 画面の表示領域 -->
